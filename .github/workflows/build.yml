name: Build Maykop signing probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # This workflow is for a separate public repository containing ONLY this
    # credential-free probe. Skip private repositories to avoid billed builds.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build probe for re-signing
        run: bash scripts/build-unsigned.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MaykopSigningProbe
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 7
