name: Build free Maykop iPhone prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build unsigned single target app and inspect it
        run: bash scripts/build-unsigned.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MaykopTest
          path: build/*
          if-no-files-found: error
          retention-days: 7
