name: MaykopSigningProbe
options:
  bundleIdPrefix: org.maykopvpn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MaykopSigningProbe:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.maykopvpn.signingprobe
        CODE_SIGN_ENTITLEMENTS: Signing/PacketTunnel.entitlements
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: MAYKOP VPN Test
        UILaunchScreen: {}
    dependencies:
      - target: ProbeTunnel
        embed: true
    scheme: {}
  ProbeTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.maykopvpn.signingprobe.tunnel
        CODE_SIGN_ENTITLEMENTS: Signing/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Tunnel-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
